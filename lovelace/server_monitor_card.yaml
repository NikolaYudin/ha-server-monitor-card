type: vertical-stack
cards:
  - type: grid
    columns: 4
    square: false
    cards:

      # ═══════ ГИПЕРВИЗОР (Proxmox VE) ═══════
      - type: vertical-stack
        cards:
          - type: custom:mushroom-template-card
            primary: Proxmox VE
            secondary: >-
              {% set h = states('sensor.proxmox_uptime') | float(0) %}
              {{ states('sensor.proxmox_status') }} · {{ (h // 24) | int }}д {{ (h % 24) | int }}ч
            icon: mdi:server
            icon_color: >-
              {% set s = states('sensor.proxmox_status') | lower %}
              {% if s in ['running','online','on','active'] %}green
              {% elif s in ['paused','suspended','unknown'] %}yellow
              {% else %}grey{% endif %}
            layout: horizontal
            entity: sensor.proxmox_status
            tap_action: {action: more-info}
            card_mod:
              style: |
                ha-card {
                  border-radius: 8px 8px 0 0;
                  background: var(--ha-card-background);
                  border: 1px solid rgba(0,0,0,.08);
                  border-bottom: none;
                  border-left: 3px solid #E57000;
                  box-shadow: 0 2px 4px rgba(0,0,0,.08);
                  font-family: 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;
                }

          - type: horizontal-stack
            cards:
              - type: custom:button-card
                icon: mdi:stop
                show_name: false
                tap_action:
                  action: call-service
                  service: button.press
                  service_data: {entity_id: button.proxmox_stop}
                  confirmation: {text: Остановить Proxmox?}
                styles:
                  card:
                    - border-radius: 6px
                    - background: rgba(229,112,0,.06)
                    - border: 1px solid rgba(229,112,0,.15)
                    - height: 32px
                    - width: 32px
                    - padding: 0px
                  icon:
                    - width: 15px
                    - height: 15px
                    - color: '#E57000'

              - type: custom:button-card
                icon: mdi:restart
                show_name: false
                tap_action:
                  action: call-service
                  service: button.press
                  service_data: {entity_id: button.proxmox_reboot}
                  confirmation: {text: Перезапустить Proxmox?}
                styles:
                  card:
                    - border-radius: 6px
                    - background: rgba(229,112,0,.06)
                    - border: 1px solid rgba(229,112,0,.15)
                    - height: 32px
                    - width: 32px
                    - padding: 0px
                  icon:
                    - width: 15px
                    - height: 15px
                    - color: '#E57000'

              - type: custom:button-card
                icon: mdi:power
                show_name: false
                tap_action:
                  action: call-service
                  service: button.press
                  service_data: {entity_id: button.proxmox_shutdown}
                  confirmation: {text: Выключить Proxmox?}
                styles:
                  card:
                    - border-radius: 6px
                    - background: rgba(64,64,64,.06)
                    - border: 1px solid rgba(64,64,64,.15)
                    - height: 32px
                    - width: 32px
                    - padding: 0px
                  icon:
                    - width: 15px
                    - height: 15px
                    - color: '#404040'
            card_mod:
              style: |
                #root {
                  display: flex;
                  justify-content: center;
                  gap: 8px;
                  padding: 8px 12px;
                  background: var(--ha-card-background);
                  border: 1px solid rgba(0,0,0,.08);
                  border-top: 1px solid rgba(0,0,0,.05);
                  border-left: 3px solid #E57000;
                  border-radius: 0 0 8px 8px;
                  box-shadow: 0 2px 4px rgba(0,0,0,.08);
                  margin-bottom: 8px;
                }

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mini-graph-card
                name: CPU
                icon: mdi:cpu-64-bit
                entities: [{entity: sensor.proxmox_cpu_usage, color: '#E57000'}]
                hours_to_show: 24
                points_per_hour: 4
                line_width: 2
                height: 56
                show: {legend: false, fill: fade, labels: false, points: false}
                card_mod: &graph-mod
                  style: |
                    ha-card {
                      border-radius: 8px;
                      background: var(--ha-card-background);
                      border: 1px solid rgba(0,0,0,.06);
                      box-shadow: 0 1px 2px rgba(0,0,0,.05);
                      font-family: 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;
                    }
                    .header {font-size:11px;font-weight:600;color:var(--secondary-text-color);padding:6px 10px 2px}

              - type: custom:mini-graph-card
                name: Память
                icon: mdi:memory
                entities: [{entity: sensor.proxmox_memory_usage, color: '#404040'}]
                hours_to_show: 24
                points_per_hour: 4
                line_width: 2
                height: 56
                show: {legend: false, fill: fade, labels: false, points: false}
                card_mod: *graph-mod

              - type: custom:mini-graph-card
                name: local
                icon: mdi:harddisk
                entities: [{entity: sensor.proxmox_local_storage, color: '#E57000'}]
                hours_to_show: 24
                points_per_hour: 4
                line_width: 2
                height: 56
                show: {legend: false, fill: fade, labels: false, points: false}
                card_mod: *graph-mod

              - type: custom:mini-graph-card
                name: local-zfs
                icon: mdi:harddisk
                entities: [{entity: sensor.proxmox_local_zfs, color: '#F08000'}]
                hours_to_show: 24
                points_per_hour: 4
                line_width: 2
                height: 56
                show: {legend: false, fill: fade, labels: false, points: false}
                card_mod: *graph-mod

              - type: custom:mini-graph-card
                name: nas-zfs
                icon: mdi:harddisk
                entities: [{entity: sensor.proxmox_nas_zfs, color: '#404040'}]
                hours_to_show: 24
                points_per_hour: 4
                line_width: 2
                height: 56
                show: {legend: false, fill: fade, labels: false, points: false}
                card_mod: *graph-mod

